services:
  cpa-manager:
    build:
      context: .
      dockerfile: Dockerfile.usage-service
    image: seakee/cpa-manager:latest
    restart: unless-stopped
    ports:
      - "18317:18317"
    environment:
      HTTP_ADDR: "0.0.0.0:18317"
      USAGE_DB_PATH: "/data/usage.sqlite"
      USAGE_COLLECTOR_MODE: "auto"
      USAGE_RESP_QUEUE: "usage"
      USAGE_RESP_POP_SIDE: "right"
      USAGE_BATCH_SIZE: "100"
      USAGE_POLL_INTERVAL_MS: "500"
      USAGE_QUERY_LIMIT: "50000"
      USAGE_CORS_ORIGINS: "*"
    volumes:
      - cpa-manager-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18317/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Sidecar reverse proxy that enforces per-API-key limits in front of
  # cliproxy. Clients point at this service instead of cliproxy directly.
  # The gate calls cpa-manager /check for every request, forwards on
  # allow, and returns the Claude-style 429 errorResponse embedded in
  # /check when blocked.
  limit-gate:
    build:
      context: .
      dockerfile: Dockerfile.limit-gate
    image: seakee/cpa-limit-gate:latest
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      LIMIT_GATE_LISTEN: "0.0.0.0:8788"
      # Upstream proxy clients used to talk to directly.
      LIMIT_GATE_UPSTREAM: "https://cliproxy.omelet.tech"
      # Internal cpa-manager URL (same docker network).
      LIMIT_GATE_USAGE_URL: "http://cpa-manager:18317"
      # Management key configured for cpa-manager. Leave empty if the
      # usage-service has not been bootstrapped with one.
      LIMIT_GATE_MANAGEMENT_KEY: ${LIMIT_GATE_MANAGEMENT_KEY:-}
      LIMIT_GATE_CHECK_TIMEOUT: "500ms"
    depends_on:
      cpa-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  cpa-manager-data:
